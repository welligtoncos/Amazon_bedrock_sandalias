# docker-compose.yml (SIMPLIFICADO)

services:
  chatbot:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        AWS_REGION: us-east-1
    container_name: catalogo-rag-chatbot
    environment:
      - AWS_ACCESS_KEY_ID=${AWS_ACCESS_KEY_ID}
      - AWS_SECRET_ACCESS_KEY=${AWS_SECRET_ACCESS_KEY}
      - AWS_REGION=us-east-1
    volumes:
      - ./data:/app/data
      - ./app.py:/app/app.py
      - ./rag:/app/rag
      - ./config:/app/config
    stdin_open: true
    tty: true
    restart: unless-stopped
    networks:
      - catalogo-network

networks:
  catalogo-network:
    driver: bridge